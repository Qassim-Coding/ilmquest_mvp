<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'app occupe tout l'écran, et les marges pt-safe / pb-safe (src/index.css)
         écartent l'en-tête et la barre d'onglets des barres du téléphone (heure en haut, boutons en bas) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F8F5" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS n'accepte que le PNG pour l'écran d'accueil -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>IlmQuest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
