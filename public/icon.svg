<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="42%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a2a5e"/>
      <stop offset="100%" stop-color="#06091f"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="55%" stop-color="#d4a012"/>
      <stop offset="100%" stop-color="#8a6200"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="50%" stop-color="#EF9F27"/>
      <stop offset="100%" stop-color="#8a5e00"/>
    </radialGradient>
    <clipPath id="c"><circle cx="16" cy="16" r="15"/></clipPath>
  </defs>

  <!-- Fond -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- Étoiles de fond -->
  <g clip-path="url(#c)" opacity="0.8">
    <circle cx="7"  cy="6"  r="0.5" fill="#fffbe6"/>
    <circle cx="25" cy="5"  r="0.4" fill="#fffbe6"/>
    <circle cx="27" cy="18" r="0.5" fill="#fffbe6"/>
    <circle cx="6"  cy="22" r="0.4" fill="#fffbe6"/>
    <circle cx="20" cy="27" r="0.4" fill="#fffbe6"/>
    <circle cx="10" cy="28" r="0.3" fill="#fffbe6"/>
  </g>

  <!-- Croissant de lune -->
  <circle cx="14" cy="16" r="9" fill="url(#moon)" clip-path="url(#c)"/>
  <circle cx="18" cy="13" r="8" fill="#06091f" clip-path="url(#c)"/>

  <!-- Étoile à 8 branches -->
  <g transform="translate(24.5, 8.5) rotate(22.5)">
    <polygon points="0,-4.5 1,-1 4.5,0 1,1 0,4.5 -1,1 -4.5,0 -1,-1" fill="url(#star)"/>
    <circle cx="0" cy="0" r="1" fill="#fffbe6"/>
  </g>

  <!-- Bordure or -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#d4a012" stroke-width="0.8" opacity="0.6"/>
</svg>
